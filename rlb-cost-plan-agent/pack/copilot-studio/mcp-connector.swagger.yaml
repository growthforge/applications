# Custom connector definition for the custom-connector route in Copilot Studio (Swagger 2.0).
# Replace HOST with the deployed host name (no scheme, no path). Not imported anywhere yet.
# The MCP onboarding wizard (AGENT.md, section 3) does the same job without this file.
swagger: '2.0'
info:
  title: Cost-plan check (MCP)
  description: Read-only first-pass checks of elemental cost plans. Results are items for the cost manager to review; nothing approves, edits or sends a figure.
  version: 1.0.0
host: HOST
basePath: /
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /mcp:
    post:
      summary: Cost-plan check MCP server
      description: Streamable HTTP endpoint of the cost-plan check MCP server.
      operationId: InvokeMCP
      x-ms-agentic-protocol: mcp-streamable-1.0
      responses:
        '200':
          description: Success
securityDefinitions:
  api_key:
    type: apiKey
    in: header
    name: x-api-key
security:
  - api_key: []
